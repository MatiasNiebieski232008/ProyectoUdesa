<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <h1>Iniciar sesion</h1>
    <a href="index.html" class="volver">Volver</a>

    <form action="/enviar" method="post" class="form">

        <p>
            <label for="nombre">Nombre y apellido:</label><br>
            <input type="text" id="nombre" name="nombre" required placeholder="Ingresar nombre y apellido">
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="Ingresar email">
        </p>

        <p>
            <label for="contraseña">contraseña:</label><br>
            <input type="password" id="contraseña" name="contraseña" placeholder="Ingresar contraseña">
        </p>


        <p>
            <button type="submit">Iniciar sesion</button>
        </p>
            No tenes una cuenta, <a href="register.html">registrate</a>
    </form>
</body>
</html>
