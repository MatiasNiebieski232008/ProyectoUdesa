<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de Proudctos - Home</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="index">

    <header>
        <div class="header-logo">
            <a href="./index.html">
                <img src="./img/logo.png" alt="Logo del sitio">
            </a>
        </div>

        <nav class="header-nav">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li class="link-login"><a href="./login.html">Login</a></li>
                <li class="link-registro"><a href="./register.html">Register</a></li>
                <li class="saludo"></li>
                <li class="link-logout"><a href="./index.html">Logout</a></li>
            </ul>
        </nav>

        <form class="header-search" action="./results.html" method="GET">
            <input type="text" name="search" placeholder="Buscar productos" value="">
            <button type="submit">Buscar</button>
            <p class="mensaje-error"></p>
        </form>
    </header>

    <section class="contenido-index">

        <nav class="var">
            <h2>Categorías</h2>
            <hr>

            <ul class="lista-categorias"></ul>
        </nav>

        <main class="contenido-principal">
            <h1>Catálogo de productos</h1>

            <section class="productos-perfumes">
                <h2>Perfumes</h2>
                <div class="contenedor-productos contenedor-perfumes"></div>
            </section>

            <section class="productos-autos">
                <h2>Autos</h2>
                <div class="contenedor-productos contenedor-autos"></div>
            </section>
        </main>
    </section>

    <footer>
        <p>Integrantes: Francisco - Mateo - Matias</p>
    </footer>

    <script src="./js/categorias.js"></script>
    <script src="./js/buscador.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/index.js"></script>

</body>
</html>
