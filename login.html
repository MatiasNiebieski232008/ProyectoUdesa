<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="login">
    
    <nav class="nav">
        <img class="logo" src="./img/logo.png" alt="">
        <a class="pos"  href="./index.html">
                 <p>Inicio</p>
            <img class="home" src="./img/home.webp" alt="">
        </a>
    </nav>

    <section class="abajo">

    <form action="./index.html" class="form" method="get">

        <h1>Iniciar sesión</h1>

        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" value="" placeholder="Ingresar email">
            <p class="mensaje-error error-email"></p>
        </div>

        <div>
            <label for="clave">Contraseña:</label><br>
            <input type="password" id="clave" name="clave" value="" placeholder="Ingresar contraseña">
            <p class="mensaje-error error-clave"></p>
        </div>

        <div>
            <button type="submit">Ingresar</button>
        </div>
        <div><a href="./register.html">No tengo cuenta</a></div>
    </form>
</section>

    <script src="./js/login.js"></script>
</body>
</html>
