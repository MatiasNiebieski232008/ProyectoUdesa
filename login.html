<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login">
    
    <nav class="nav">
        <img class="logo" src="./img/logo.png" alt="">
        <a class="pos"  href="index.html">
                 <p>Inicio</p>
            <img class="home" src="./img/home.webp" alt="">
        </a>
    </nav>

    <div class="abajo">

    <form action="index.html" class="form" method="get">

        <h1>Iniciar sesión</h1>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" value=""required placeholder="Ingresar email">
        </p>

        <p>
            <label for="clave">Contraseña:</label><br>
            <input type="password" id="clave" name="clave" value="" required placeholder="Ingresar contraseña">
        </p>

        <p>
            <button type="submit">Ingresar</button>
        </p>
        <p><a href="register.html">No tengo cuenta</a></p>
    </form>
    </div>
</body>
</html>
