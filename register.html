<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="register">
     
     
    <div class="abajo">
    <form action="/enviar" method="post" class="form">
<h1>Registro</h1>
        <p>
            <label for="nombre">Nombre y apellido:</label><br>
            <input type="text" id="nombre" name="nombre" required placeholder="Ingresar nombre y apellido">
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="Ingresar email">
        </p>

        <p>
            <label for="clave">Contraseña:</label> <br>
            <input  placeholder="Ingresar contraseña" type="password" id="clave" name="clave">
        </p>

         <p>
            <label for="confcontra">Repetir contraseña:</label><br>
            <input type="password" id="confcontra" name="confcontra" placeholder="Ingresar contraseña">
        </p>


        <p>
            <button type="submit">Registrarse</button>
        </p>
        <p>Ya tenes una cuenta, <a href="login.html">Inicia sesion</a></p>
        <a href="index.html">Volver al inicio</a>
        </div>
<form>
  
</form>

    </form>
</body>
</html>
