<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="register">
     
    <nav class="nav">
        <img class="logo" src="./img/logo.png" alt="">
        <a class="pos"  href="index.html">
                 <p>Inicio</p>
            <img class="home" src="./img/home.webp" alt="">
        </a>
    </nav>
     
    <div class="abajo">
    <form action="login.html" class="form">
        <h1>Registro</h1>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="Ingresar email">
        </p>

        <p>
            <label for="clave">Contraseña:</label><br>
            <input type="password" id="clave" name="clave" required placeholder="Ingresar contraseña">
        </p>

        <p>
            <label for="confcontra">Repetir contraseña:</label><br>
            <input type="password" id="confcontra" name="confcontra" required placeholder="Repetir contraseña">
        </p>

        <p>
            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Acepto términos y condiciones</label>
        </p>

        <p>
            <button type="submit">Registrarme</button>
        </p>

        <p><a href="login.html">Ya tengo una cuenta</a></p>
    </form>
    </div>
</body>
</html>
