<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - Detalle</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="index">

    <header>

        <div class="header-logo">
            <a href="./index.html">
                <img src="./img/logo.png" alt="Logo del sitio">
            </a>
        </div>

        <nav class="header-nav">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./login.html">Login</a></li>
                <li><a href="./register.html">Register</a></li>
            </ul>
        </nav>

        <form class="header-search" action="./results.html" method="GET">
            <input type="text" name="search" placeholder="Buscar productos">
            <button type="submit">Buscar</button>
            <p class="mensaje-error"></p>
        </form>

    </header>

    <section class="contenido-index">

        <nav class="var">
            <h2>Categorías</h2>
            <hr>

            <ul class="lista-categorias"></ul>
        </nav>

        <main class="contenido-principal">

            <article class="detalle-producto">

                <img class="detalle-imagen" src="" alt="">

                <div class="detalle-datos">
                    <h1 class="detalle-nombre"></h1>
                    <p class="detalle-marca"></p>
                    <p class="detalle-descripcion"></p>
                    <p class="detalle-precio"></p>
                    <p>Categoría: <a class="detalle-categoria" href=""></a></p>
                    <p class="detalle-stock"></p>

                    <ul class="tags"></ul>
                </div>

            </article>

            <section class="reviews">
                <h2>Comentarios</h2>
            </section>

        </main>
    </section>

    <footer>
        <p>Integrantes: Francisco - Mateo - Matias</p>
    </footer>

    <script src="./js/categorias.js"></script>
    <script src="./js/buscador.js"></script>
    <script src="./js/product.js"></script>

</body>

</html>
